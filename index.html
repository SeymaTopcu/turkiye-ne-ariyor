<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Türkiye Ne Arıyor?</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#171817;font-family:Inter,system-ui,sans-serif}header{padding:28px 34px 18px;border-bottom:1px solid #ddd9d2}.brand{font:700 clamp(34px,5vw,56px)/.92 Georgia,serif;letter-spacing:-.055em}.brand em{font-style:normal;color:#2868e8}.sub{margin-top:10px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#777}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:13px 34px;border-bottom:1px solid #ddd9d2}.toolbar button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.toolbar button.active{background:#171817;color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,.75fr);min-height:650px}.mapcol{padding:27px 30px 24px 34px;border-right:1px solid #ddd9d2}.side{padding:28px 30px}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:850;color:#777}.maptitle{font:700 20px Georgia,serif;margin-top:5px}.map{min-height:460px;display:flex;align-items:center;justify-content:center;position:relative}.map svg{width:100%;height:auto;max-height:520px}.province{stroke:#f5f3ee;stroke-width:.75;fill:#dce5f7;cursor:pointer}.province:hover{fill:#88a8e9}.province.selected{fill:#2868e8;stroke:#171817;stroke-width:2}.city{font:700 36px Georgia,serif;margin-top:5px}.when{font-size:11px;color:#777;margin-top:7px}.rows{margin-top:12px}.row{display:grid;grid-template-columns:26px 1fr auto;gap:9px;padding:11px 0;border-bottom:1px solid #e6e3dd}.rank{font:13px Georgia;color:#999}.term{font-size:13px;font-weight:750}.score{font-size:11px;font-weight:850}.empty{padding:24px 0;font-size:12px;line-height:1.6;color:#777}.selected{margin-top:10px;color:#2868e8;font:700 18px Georgia,serif}@media(max-width:780px){header,.toolbar,.mapcol,.side{padding-left:18px;padding-right:18px}.layout{grid-template-columns:1fr}.mapcol{border-right:0;border-bottom:1px solid #ddd9d2}.map{min-height:300px}}</style></head>
<body><header><div class="brand">Türkiye <em>ne arıyor?</em></div><div class="sub">Google Trends · 81 il · günlük arşiv</div></header><div class="toolbar"><button class="active" data-mode="top">En çok aranan</button><button data-mode="rising">Yükselen</button></div><main class="layout"><section class="mapcol"><div class="eyebrow">Türkiye · 81 il</div><div class="maptitle">Bir ile tıkla.</div><div id="map" class="map">Harita yükleniyor…</div><div id="selected" class="selected">İstanbul seçili</div></section><aside class="side"><div class="eyebrow">Seçili il</div><div id="city" class="city">İstanbul</div><div id="when" class="when">Gerçek veri bekleniyor…</div><div id="rows" class="rows"></div></aside></main>
<script type="module">const S={city:'İstanbul',mode:'top',data:null,paths:null,d3:null};const $=s=>document.querySelector(s);const aliases={Istanbul:'İstanbul',Izmir:'İzmir',Diyarbakir:'Diyarbakır',Sanliurfa:'Şanlıurfa',Kahramanmaras:'Kahramanmaraş',Agri:'Ağrı',Corum:'Çorum',Gumushane:'Gümüşhane',Kirklareli:'Kırklareli',Kirsehir:'Kırşehir',Kutahya:'Kütahya',Mus:'Muş',Sirnak:'Şırnak'};const tr=s=>aliases[s]||s;function fname(f){const p=f.properties||{};return tr(p.name||p.NAME_1||p.NAME||p.adm1_tr||p.il_adi||p.IL_ADI||p.city||'İl')}function rdata(){if(!S.data)return null;const k=Object.keys(S.data.regions||{}).find(k=>k.toLocaleLowerCase('tr-TR')===S.city.toLocaleLowerCase('tr-TR'));return k?S.data.regions[k]:null}function render(){$('#city').textContent=S.city;$('#selected').textContent=S.city+' seçili';$('#when').textContent=S.data?(S.data.refresh_date+' · '+(S.mode==='top'?'Top 25':'Rising Top 25')):'Gerçek veri henüz çekilmedi';const box=$('#rows');box.innerHTML='';const list=rdata()?.[S.mode]||[];if(!list.length){box.innerHTML='<div class="empty">Bu il için henüz gerçek Google Trends verisi yok. Günlük veri görevi ilk başarılı çalıştığında burada otomatik görünecek.</div>'}else list.slice(0,25).forEach((x,i)=>{const d=document.createElement('div');d.className='row';d.innerHTML='<div class="rank">'+String(i+1).padStart(2,'0')+'</div><div class="term"></div><div class="score">'+(x.score??'')+'</div>';d.querySelector('.term').textContent=x.term;box.appendChild(d)});if(S.paths)S.paths.classed('selected',f=>fname(f).toLocaleLowerCase('tr-TR')===S.city.toLocaleLowerCase('tr-TR'))}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()}));try{const r=await fetch('data/latest.json',{cache:'no-store'});if(r.ok)S.data=await r.json()}catch{}render();try{S.d3=await import('https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm');const m=await import('https://cdn.jsdelivr.net/gh/ttezer/turkiye-harita-verisi@master/dist/geojson/provinces.geojson',{with:{type:'json'}});const geo=m.default||m,features=geo.features||[];$('#map').textContent='';const svg=S.d3.select('#map').append('svg').attr('viewBox','0 0 900 510');const proj=S.d3.geoMercator().fitExtent([[16,20],[884,490]],{type:'FeatureCollection',features}),path=S.d3.geoPath(proj);S.paths=svg.selectAll('path').data(features).join('path').attr('class','province').attr('d',path).attr('tabindex',0).on('click',(e,f)=>{S.city=fname(f);render()}).on('keydown',(e,f)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();S.city=fname(f);render()}});render()}catch(e){$('#map').textContent='Harita yüklenemedi.';console.error(e)}</script></body></html>
