<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Türkiye Ne Arıyor?</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#171817;font-family:Inter,system-ui,sans-serif}header{padding:28px 34px 18px;border-bottom:1px solid #ddd9d2}.brand{font:700 clamp(34px,5vw,56px)/.92 Georgia,serif;letter-spacing:-.055em}.brand em{font-style:normal;color:#2868e8}.sub{margin-top:10px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#777}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:13px 34px;border-bottom:1px solid #ddd9d2;align-items:center}.toolbar .sep{width:1px;height:26px;background:#d7d3cc;margin:0 4px}.toolbar button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e9e6df;color:#171817}.toolbar button.active{background:#171817;color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,.75fr);min-height:650px}.mapcol{padding:27px 30px 24px 34px;border-right:1px solid #ddd9d2}.side{padding:28px 30px}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:850;color:#777}.maptitle{font:700 20px Georgia,serif;margin-top:5px}.explain{font-size:11px;line-height:1.5;color:#777;margin-top:8px;max-width:650px}.map{min-height:460px;display:flex;align-items:center;justify-content:center;position:relative}.map svg{width:100%;height:auto;max-height:520px}.province{stroke:#aebbd2;stroke-width:.85;stroke-linejoin:round;vector-effect:non-scaling-stroke;fill:#dce5f7;cursor:pointer}.province:hover{fill:#9db6e8;stroke:#8193b4;stroke-width:1}.province.selected{fill:#2868e8;stroke:#244f96;stroke-width:1.25}.city{font:700 36px Georgia,serif;margin-top:5px}.when{font-size:11px;color:#777;margin-top:7px}.rows{margin-top:12px}.row{display:grid;grid-template-columns:26px 1fr auto;gap:9px;padding:11px 0;border-bottom:1px solid #e6e3dd}.rank{font:13px Georgia;color:#999}.term{font-size:13px;font-weight:750}.score{font-size:11px;font-weight:850;text-align:right}.score small{display:block;color:#999;font-size:8px;font-weight:600;margin-top:2px}.empty{padding:24px 0;font-size:12px;line-height:1.6;color:#777}.selectedline{margin-top:10px;color:#2868e8;font:700 18px Georgia,serif}@media(max-width:780px){header,.toolbar,.mapcol,.side{padding-left:18px;padding-right:18px}.toolbar .sep{display:none}.layout{grid-template-columns:1fr}.mapcol{border-right:0;border-bottom:1px solid #ddd9d2}.map{min-height:300px}}</style></head>
<body><header><div class="brand">Türkiye <em>ne arıyor?</em></div><div class="sub">Google Trends · 81 il · günlük güncelleme</div></header><div class="toolbar"><button data-mode="top">En çok aranan</button><button data-mode="rising">Yükselen</button><span class="sep"></span><button data-period="current">Güncel</button><button data-period="weekly">Son 7 gün</button><button data-period="monthly">Son 30 gün</button></div><main class="layout"><section class="mapcol"><div class="eyebrow">Türkiye · 81 il</div><div class="maptitle">Bir ile tıkla.</div><div id="explain" class="explain"></div><div id="map" class="map">Harita yükleniyor…</div><div id="selectedline" class="selectedline">İstanbul seçili</div></section><aside class="side"><div class="eyebrow">Seçili il</div><div id="city" class="city">İstanbul</div><div id="when" class="when">Gerçek veri bekleniyor…</div><div id="rows" class="rows"></div></aside></main>
<script type="module">
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);const validPeriod=p=>['current','weekly','monthly'].includes(p)?p:'current';const S={city:params.get('city')||'İstanbul',mode:params.get('mode')||'top',period:validPeriod(params.get('period')),data:null,paths:null,d3:null};
const PROVINCES=[null,'Adana','Adıyaman','Afyonkarahisar','Ağrı','Amasya','Ankara','Antalya','Artvin','Aydın','Balıkesir','Bilecik','Bingöl','Bitlis','Bolu','Burdur','Bursa','Çanakkale','Çankırı','Çorum','Denizli','Diyarbakır','Edirne','Elazığ','Erzincan','Erzurum','Eskişehir','Gaziantep','Giresun','Gümüşhane','Hakkari','Hatay','Isparta','Mersin','İstanbul','İzmir','Kars','Kastamonu','Kayseri','Kırklareli','Kırşehir','Kocaeli','Konya','Kütahya','Malatya','Manisa','Kahramanmaraş','Mardin','Muğla','Muş','Nevşehir','Niğde','Ordu','Rize','Sakarya','Samsun','Siirt','Sinop','Sivas','Tekirdağ','Tokat','Trabzon','Tunceli','Şanlıurfa','Uşak','Van','Yozgat','Zonguldak','Aksaray','Bayburt','Karaman','Kırıkkale','Batman','Şırnak','Bartın','Ardahan','Iğdır','Yalova','Karabük','Kilis','Osmaniye','Düzce'];
const LABEL={current:'Güncel',weekly:'Son 7 gün',monthly:'Son 30 gün'};const ascii=s=>String(s).toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]/g,'');function clean(s){return String(s||'').replace(/ Province$/i,'').trim()}function fname(f){const p=f.properties||{},id=String(f.id||p.id||''),m=id.match(/TR-P-(\d{2})$/);if(m&&PROVINCES[Number(m[1])])return PROVINCES[Number(m[1])];return clean(p.name||p.NAME||p.NAME_1||'')}
function pd(){return S.data?.periods?.[S.period]||null}function dataKey(city){const x=pd();if(!x)return null;const t=ascii(city);return Object.keys(x.regions||{}).find(k=>ascii(clean(k))===t)||null}function rdata(){const x=pd(),k=dataKey(S.city);return x&&k?x.regions[k]:null}function list(){return [...(rdata()?.[S.mode]||[])].sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0)||(Number(a.rank)||999)-(Number(b.rank)||999))}function navURL(c={}){const u=new URL(location.href);u.searchParams.set('city',c.city??S.city);u.searchParams.set('mode',c.mode??S.mode);u.searchParams.set('period',c.period??S.period);u.searchParams.set('v','14');return u.pathname+u.search}
function render(){document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===S.mode));document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x.dataset.period===S.period));$('#city').textContent=S.city;$('#selectedline').textContent=S.city+' seçili';const x=pd(),days=x?.snapshot_days||0;$('#when').textContent=S.data?`${S.data.refresh_date} · ${LABEL[S.period]}${days?' · '+days+' günlük snapshot':''} · ${S.mode==='top'?'En çok aranan':'Yükselen'}`:'Gerçek veri henüz çekilmedi';$('#explain').textContent=S.period==='current'?"Google'ın en son günlük Top 25 setindeki terimler gösterilir.":`Google'ın son ${S.period==='weekly'?'7':'30'} gündeki günlük Top 25 listeleri birleştirilir. Bir terim ne kadar sık ve ne kadar üst sırada yer aldıysa dönem puanı o kadar yüksektir.`;const box=$('#rows');box.innerHTML='';const a=list();if(!a.length)box.innerHTML='<div class="empty">Bu il ve dönem için yeterli Google Trends verisi yok.</div>';else a.slice(0,25).forEach((x,i)=>{const d=document.createElement('div');d.className='row';const sub=S.period==='current'?'günlük sıra puanı':`dönem puanı · ${x.appearances||1} gün`;d.innerHTML='<div class="rank">'+String(i+1).padStart(2,'0')+'</div><div class="term"></div><div class="score">'+Math.round(Number(x.score)||0)+'<small>'+sub+'</small></div>';d.querySelector('.term').textContent=x.term;box.appendChild(d)});if(S.paths)S.paths.classed('selected',f=>ascii(fname(f))===ascii(S.city))}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>location.href=navURL({mode:b.dataset.mode}));document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>location.href=navURL({period:b.dataset.period}));try{const r=await fetch('./data/latest.json?ts='+Date.now(),{cache:'no-store'});if(r.ok)S.data=await r.json()}catch(e){console.error(e)}render();try{S.d3=await import('https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm');const m=await import('https://cdn.jsdelivr.net/gh/ttezer/turkiye-harita-verisi@master/dist/geojson/provinces.geojson',{with:{type:'json'}});const geo=m.default||m,features=geo.features||[],map=$('#map');map.textContent='';const svg=S.d3.select(map).append('svg').attr('viewBox','0 0 900 510');const proj=S.d3.geoMercator().fitExtent([[16,20],[884,490]],{type:'FeatureCollection',features}),path=S.d3.geoPath(proj);const links=svg.selectAll('a').data(features).join('a').attr('href',f=>navURL({city:fname(f)})).attr('target','_self');S.paths=links.append('path').attr('class','province').attr('d',path);links.append('title').text(f=>fname(f));render()}catch(e){console.error(e);$('#map').textContent='Harita yüklenemedi.'}
</script></body></html>
